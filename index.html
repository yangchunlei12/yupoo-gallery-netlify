<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Yupoo Replacement Gallery Import</title>
  <style>
    body{font:16px/1.6 system-ui,sans-serif;max-width:820px;margin:48px auto;padding:0 20px;color:#172033}.card{border:1px solid #dde3ee;border-radius:16px;padding:24px;box-shadow:0 8px 30px #17203312}h1{margin-top:0}code{background:#f3f5f8;padding:2px 6px;border-radius:5px}a{color:#135dd8}button{border:0;border-radius:9px;background:#135dd8;color:#fff;padding:10px 18px;font-size:16px;cursor:pointer}button:disabled{opacity:.55;cursor:wait}#status{white-space:pre-wrap}
  </style>
</head>
<body><div class="card"><h1>Yupoo Replacement Gallery</h1><p>分类：<code>7 categories · 116 products · 2,048 images</code></p><p><button id="start">开始替换导入</button></p><p id="status">正在读取导入状态…</p><p><a href="/api/manifest.csv">下载 CSV 清单</a> · <a href="/api/manifest.json">查看 JSON 清单</a></p></div>
<script>const statusEl=document.querySelector('#status'),start=document.querySelector('#start');async function tick(){try{const r=await fetch('/api/status',{cache:'no-store'}),s=await r.json();statusEl.textContent=JSON.stringify(s,null,2);start.disabled=['clearing','running'].includes(s.state);start.textContent=s.state==='complete'?'重新导入全部图片':'开始替换导入'}catch(e){statusEl.textContent=String(e)}}start.onclick=async()=>{if(!confirm('确认清空现有图库数据，并导入 7 个分类的 116 个商品和 2,048 张图片？'))return;start.disabled=true;start.textContent='正在启动…';try{const r=await fetch('/api/import',{method:'POST'});statusEl.textContent=r.ok?'导入任务已启动，请保持页面打开并等待状态更新。':`启动失败：HTTP ${r.status}`}catch(e){statusEl.textContent=String(e)}setTimeout(tick,1500)};tick();setInterval(tick,5000)</script></body>
</html>
